# Force NIXPACKS to use Python instead of auto-detecting Node from package.json.
# The repo contains both src/ (JS) and python/ (Python); the production
# bot now runs Python.

providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc"]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python -m python.discord_bot"
