<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coverage Map</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #c9d1d9; font-family: 'Consolas', 'Monaco', monospace; padding: 20px; font-size: 16px; }
h1 { font-size: 26px; margin-bottom: 4px; }
.subtitle { color: #8b949e; font-size: 15px; margin-bottom: 16px; }

/* Legend */
.legend { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
.legend-title { font-weight: bold; color: #c9d1d9; margin-bottom: 6px; font-size: 16px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.legend-swatch { width: 32px; height: 16px; border-radius: 4px; flex-shrink: 0; }
.legend-bar-demo { height: 6px; border-radius: 3px; flex-shrink: 0; }
.legend-label { color: #8b949e; }

/* Summary bar */
.summary { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.summary-item { padding: 8px 14px; border-radius: 6px; font-size: 15px; font-weight: bold; }
.summary-item.cov-strong { background: #152c15; border: 1px solid #27ae60; color: #27ae60; }
.summary-item.cov-partial { background: #2c2515; border: 1px solid #d4a017; color: #d4a017; }
.summary-item.cov-weak { background: #2c1515; border: 1px solid #c0392b; color: #c0392b; }
.summary-item.cov-none { background: #1a1a2e; border: 1px solid #555; color: #888; }
.summary-item.meta { background: #161b22; border: 1px solid #30363d; color: #8b949e; }
.summary-item.incident { background: #2c1520; border: 1px solid #f85149; color: #f85149; }

/* Telemetry info */
.telemetry-info { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; margin-bottom: 20px; font-size: 14px; color: #8b949e; }
.telemetry-info strong { color: #c9d1d9; }

/* Category sections */
.category { margin-bottom: 24px; }
.category-header { font-size: 17px; text-transform: uppercase; color: #8b949e; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }

/* Region grid */
.region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }

/* Region cards — background = backend verification */
.card { border-radius: 8px; padding: 10px 12px; position: relative; cursor: default; border: 1px solid transparent; }
.card.cov-strong { background: #132e13; border-color: #27ae60; }
.card.cov-partial { background: #2a2210; border-color: #d4a017; }
.card.cov-weak { background: #2a1414; border-color: #c0392b; }
.card.cov-none { background: #161620; border-color: #333; }

.card-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
.card.cov-none .card-name { color: #8b949e; }

/* Three-layer status row */
.card-layers { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.layer-row { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.layer-label { color: #b0b8c1; min-width: 60px; font-size: 13px; }
.cov-pill { font-weight: bold; padding: 2px 8px; border-radius: 3px; font-size: 12px; text-transform: uppercase; }
.cov-pill.cov-strong { background: #27ae60; color: #000; }
.cov-pill.cov-partial { background: #d4a017; color: #000; }
.cov-pill.cov-weak { background: #c0392b; color: #fff; }
.cov-pill.cov-none { background: #333; color: #888; }

/* Exploration meter */
.expl-meter { display: flex; align-items: center; gap: 5px; }
.expl-bar-bg { height: 6px; width: 50px; background: #21262d; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.expl-bar { height: 100%; border-radius: 3px; }
.expl-bar.freq { background: #ff6b35; }
.expl-bar.common { background: #e2b93d; }
.expl-bar.rare { background: #3d8bfd; }
.expl-bar.never { background: transparent; }
.expl-text { font-size: 13px; color: #8b949e; white-space: nowrap; }

/* Live status pill */
.live-pill { font-weight: bold; padding: 3px 8px; border-radius: 3px; font-size: 13px; text-transform: uppercase; cursor: pointer; }
.live-pill.untested { background: #333; color: #888; }
.live-pill.partial { background: #d4a017; color: #000; }
.live-pill.verified { background: #27ae60; color: #000; }
.live-pill.broken { background: #f85149; color: #fff; animation: pulse-red 2s infinite; }
.live-pill.stale { background: #6e40c9; color: #fff; }
@keyframes pulse-red { 0%,100%{opacity:1} 50%{opacity:0.7} }

/* Incident count badge */
.incident-count { font-size: 9px; padding: 1px 5px; border-radius: 8px; background: #f85149; color: #fff; font-weight: bold; margin-left: 4px; }

/* Report issue button */
.report-btn { font-size: 12px; padding: 3px 8px; border-radius: 3px; background: #21262d; color: #8b949e; border: 1px solid #30363d; cursor: pointer; margin-left: auto; }
.report-btn:hover { background: #30363d; color: #c9d1d9; }

/* Evidence badges */
.evidence-row { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 3px; }
.evidence-badge { font-size: 12px; padding: 2px 6px; border-radius: 2px; }
.evidence-badge.setup-harness { background: #1a3a1a; color: #3fb950; }
.evidence-badge.flow-harness { background: #1a2a3a; color: #58a6ff; }
.evidence-badge.sim-farm { background: #2a1a3a; color: #bc8cff; }
.evidence-badge.ds-invariants { background: #3a2a1a; color: #d29922; }
.evidence-badge.gs-invariants { background: #3a1a2a; color: #f778ba; }
.evidence-badge.production-fix { background: #152c15; color: #27ae60; }
.evidence-badge.live-incident { background: #2c1515; color: #f85149; }
.evidence-badge.synthetic-only { background: #1a1a2e; color: #666; }

/* Siblings row */
.siblings-row { font-size: 12px; color: #b0b8c1; margin-top: 2px; }
.siblings-row a { color: #58a6ff; text-decoration: none; cursor: pointer; }
.siblings-row a:hover { text-decoration: underline; }

/* Card hover detail */
.card-notes { font-size: 13px; color: #b0b8c1; margin-top: 4px; max-height: 0; overflow: hidden; transition: max-height 0.2s; }
.card:hover .card-notes { max-height: 120px; }

/* Recent incidents section */
.incidents-section { margin-top: 24px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
.incidents-section h2 { font-size: 14px; color: #f85149; margin-bottom: 10px; }
.incident-entry { padding: 6px 0; border-bottom: 1px solid #21262d; font-size: 14px; }
.incident-entry:last-child { border-bottom: none; }
.sev-badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: bold; text-transform: uppercase; }
.sev-badge.blocker { background: #f85149; color: #fff; }
.sev-badge.major { background: #d4a017; color: #000; }
.sev-badge.minor { background: #333; color: #8b949e; }

/* Needs More Testing */
.needs-section { margin-top: 24px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
.needs-section h2 { font-size: 14px; margin-bottom: 4px; }
.needs-section .section-desc { font-size: 11px; color: #8b949e; margin-bottom: 10px; }
.needs-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid #21262d; font-size: 15px; }
.needs-item:last-child { border-bottom: none; }
.needs-rank { font-weight: bold; min-width: 20px; }
.needs-name { flex: 1; }
.needs-hits { color: #d4a017; font-size: 11px; }

/* History */
.history-section { margin-top: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
.history-section h2 { font-size: 14px; color: #27ae60; margin-bottom: 10px; }
.history-item { font-size: 11px; padding: 4px 0; border-bottom: 1px solid #21262d; color: #8b949e; }
.history-item:last-child { border-bottom: none; }
.history-item .date { color: #b0b8c1; }
.history-item .change { color: #c9d1d9; }

/* Modal overlay */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.active { display: flex; }
.modal { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; width: 420px; max-width: 95vw; }
.modal h3 { font-size: 15px; margin-bottom: 12px; }
.modal label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 3px; margin-top: 10px; }
.modal select, .modal input, .modal textarea { width: 100%; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 6px 8px; font-family: inherit; font-size: 12px; }
.modal textarea { height: 60px; resize: vertical; }
.modal-btns { display: flex; gap: 8px; margin-top: 14px; }
.modal-btns button { padding: 6px 14px; border-radius: 4px; border: none; font-family: inherit; font-size: 12px; cursor: pointer; }
.btn-save { background: #238636; color: #fff; }
.btn-save:hover { background: #2ea043; }
.btn-cancel { background: #21262d; color: #c9d1d9; }
.btn-cancel:hover { background: #30363d; }

/* Live status modal */
.status-options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.status-opt { padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid #30363d; background: #0d1117; color: #8b949e; }
.status-opt:hover { border-color: #58a6ff; color: #c9d1d9; }
.status-opt.selected { border-color: #58a6ff; background: #1a2a3a; color: #58a6ff; }

.no-data { color: #b0b8c1; font-style: italic; padding: 20px; text-align: center; }

/* File I/O toolbar */
.file-toolbar { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.file-toolbar-title { font-weight: bold; font-size: 14px; color: #c9d1d9; margin-right: 6px; }
.tb-btn { padding: 6px 14px; border-radius: 5px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.tb-btn:hover { background: #30363d; border-color: #58a6ff; }
.tb-btn.primary { background: #238636; border-color: #238636; color: #fff; }
.tb-btn.primary:hover { background: #2ea043; }
.tb-btn.danger { background: #21262d; border-color: #f85149; color: #f85149; }
.tb-btn.danger:hover { background: #2c1515; }
.tb-sep { width: 1px; height: 24px; background: #30363d; }
.tb-status { font-size: 12px; color: #8b949e; margin-left: auto; }
.tb-status .unsaved { color: #d4a017; font-weight: bold; }
.tb-status .saved { color: #27ae60; }

/* Claude handoff section */
.handoff-section { margin-top: 24px; background: #0d1520; border: 1px solid #1a3a5a; border-radius: 8px; padding: 14px; }
.handoff-section h2 { font-size: 16px; color: #58a6ff; margin-bottom: 4px; }
.handoff-desc { font-size: 13px; color: #8b949e; margin-bottom: 10px; }
.handoff-box { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-size: 13px; color: #c9d1d9; white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto; line-height: 1.5; }
.handoff-actions { display: flex; gap: 8px; margin-top: 10px; }
.copy-toast { font-size: 12px; color: #27ae60; margin-left: 8px; opacity: 0; transition: opacity 0.3s; }
.copy-toast.show { opacity: 1; }

/* Hidden file input */
.hidden-input { display: none; }
</style>
</head>
<body>

<h1>Coverage Map</h1>
<div class="file-toolbar" style="justify-content:space-between">
  <div style="display:flex;align-items:center;gap:10px">
    <div id="backend-indicator" style="font-size:13px"></div>
    <span class="copy-toast" id="save-toast" style="margin-left:8px"></span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="tb-btn" onclick="document.getElementById('legend').style.display = document.getElementById('legend').style.display === 'none' ? 'block' : 'none'">Legend</button>
    <button class="tb-btn" onclick="exportIncidents()">Export Incidents</button>
    <input type="file" id="import-file" class="hidden-input" accept=".json" onchange="importIncidents(this)">
  </div>
</div>

<div id="legend" class="legend" style="display:none"></div>
<div id="summary" class="summary"></div>
<div id="regions"></div>
<div id="recent-incidents" class="incidents-section" style="display:none"></div>
<div id="needs-hot" class="needs-section" style="display:none"></div>
<div id="needs-dark" class="needs-section" style="display:none"></div>
<div id="history" class="history-section" style="display:none"></div>

<!-- Claude Handoff -->
<div class="handoff-section">
  <h2>Claude Handoff</h2>
  <div class="handoff-desc">Copy this summary and paste it to Claude, or save incidents to file first and tell Claude to read <code>tests/headless/coverage-incidents.json</code>.</div>
  <div class="handoff-box" id="handoff-box"></div>
  <div class="handoff-actions">
    <button class="tb-btn primary" onclick="copyHandoff()">Copy to Clipboard</button>
    <span class="copy-toast" id="copy-toast">Copied!</span>
  </div>
</div>

<!-- Region Modal -->
<div id="incident-modal" class="modal-overlay">
<div class="modal">
  <h3 id="modal-title">Update Region</h3>
  <input type="hidden" id="modal-region-id">

  <label>Discord Status</label>
  <div class="status-options" id="status-options">
    <div class="status-opt" data-val="untested">Untested</div>
    <div class="status-opt" data-val="partial">Partial</div>
    <div class="status-opt" data-val="verified">Verified</div>
    <div class="status-opt" data-val="broken">Broken</div>
    <div class="status-opt" data-val="stale">Stale</div>
  </div>

  <div class="modal-btns" style="margin-top:10px">
    <button class="btn-save" onclick="saveStatusOnly()">Save Status</button>
    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
  </div>

  <div style="margin-top:14px;border-top:1px solid #30363d;padding-top:10px">
    <div style="display:flex;align-items:center;cursor:pointer;color:#8b949e;font-size:13px" onclick="document.getElementById('incident-details').style.display = document.getElementById('incident-details').style.display === 'none' ? 'block' : 'none'">
      + Report an incident (something broke)
    </div>
    <div id="incident-details" style="display:none;margin-top:8px">

      <label>Severity</label>
      <div class="status-options" id="severity-options">
        <div class="status-opt" data-val="blocker">Blocker</div>
        <div class="status-opt" data-val="major">Major</div>
        <div class="status-opt" data-val="minor">Minor</div>
      </div>

      <label>What happened?</label>
      <textarea id="modal-note" placeholder="e.g., Pounce buttons didn't appear after using dc_special"></textarea>

      <label>Game ID (optional)</label>
      <input type="text" id="modal-gameid" placeholder="e.g., 00042">

      <label>Phase (optional)</label>
      <input type="text" id="modal-phase" placeholder="e.g., combat, deployment, activation">

      <label>Last action / customId (optional)</label>
      <input type="text" id="modal-action" placeholder="e.g., dc_special_2_abc123">

      <div style="display:flex;gap:16px;margin-top:10px">
        <label style="margin:0;display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="modal-undo"> Undo fixed it</label>
        <label style="margin:0;display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="modal-refresh"> Refresh fixed it</label>
      </div>

      <div id="modal-siblings" style="font-size:12px;color:#b0b8c1;margin-top:10px"></div>

      <div class="modal-btns">
        <button class="btn-save" onclick="saveIncident()">Save Incident</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const CATEGORIES = [
  { id: 'setup', label: 'Setup & Deployment' },
  { id: 'activation', label: 'Activation & Actions' },
  { id: 'combat', label: 'Combat' },
  { id: 'effects', label: 'Effects & Conditions' },
  { id: 'round', label: 'Round Management' },
  { id: 'game', label: 'Game Lifecycle' },
  { id: 'discord', label: 'Discord / Surface' },
];

let LEDGER = null, TELEMETRY = null, INCIDENTS = null;

// ── Backend API ──

// API_BASE: empty string when served by the bot (same origin), falls back to localhost for dev
const API_BASE = '';
let backendAvailable = false;

async function checkBackend() {
  try {
    const r = await fetch(`${API_BASE}/api/coverage/ping`, { signal: AbortSignal.timeout(2000) });
    if (r.ok) {
      const data = await r.json();
      backendAvailable = data.ok && data.db;
      return backendAvailable;
    }
  } catch {}
  backendAvailable = false;
  return false;
}

async function apiPost(path, body) {
  if (!backendAvailable) return null;
  try {
    const r = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: AbortSignal.timeout(5000),
    });
    return r.ok ? r.json() : null;
  } catch { return null; }
}

async function apiGet(path) {
  if (!backendAvailable) return null;
  try {
    const r = await fetch(`${API_BASE}${path}`, { signal: AbortSignal.timeout(5000) });
    return r.ok ? r.json() : null;
  } catch { return null; }
}

function updateBackendIndicator() {
  const el = document.getElementById('backend-indicator');
  if (!el) return;
  if (backendAvailable) {
    el.innerHTML = '<span style="color:#27ae60;font-weight:bold">Backend: Connected</span>';
  } else {
    el.innerHTML = '<span style="color:#d4a017">Backend: Offline (local-only mode)</span>';
  }
}

function showSaveToast(msg, isBackend) {
  const el = document.getElementById('save-toast');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isBackend ? '#27ae60' : '#d4a017';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function classifyExploration(hits) {
  if (hits >= 500) return { label: 'Frequent', cls: 'freq', pct: 100 };
  if (hits >= 50)  return { label: 'Common', cls: 'common', pct: 70 };
  if (hits >= 1)   return { label: 'Rare', cls: 'rare', pct: 30 };
  return { label: 'Never', cls: 'never', pct: 0 };
}

// Frequency: how often this region fires in actual games (per 1000 sims)
function frequencyLabel(hits) {
  if (hits >= 5000) return { label: 'Very frequent', cls: 'freq-vf', color: '#ff6b35' };
  if (hits >= 500)  return { label: 'Frequent', cls: 'freq-f', color: '#e2b93d' };
  if (hits >= 50)   return { label: 'Infrequent', cls: 'freq-i', color: '#3d8bfd' };
  if (hits >= 1)    return { label: 'Almost never', cls: 'freq-an', color: '#b0b8c1' };
  return { label: 'Never', cls: 'freq-n', color: '#8b949e' };
}

// Verification level ordering for max() comparison
const VERIF_ORDER = { none: 0, weak: 1, partial: 2, strong: 3 };
function maxVerif(a, b) {
  return (VERIF_ORDER[a] || 0) >= (VERIF_ORDER[b] || 0) ? a : b;
}

// Auto-compute testing coverage from telemetry data
// Uses handler prefix + action type hits (not pending state, which inflates counts)
function computeAutoVerification(region, telemetry) {
  if (!telemetry) return 'none';
  const passRate = Math.min(telemetry.flow?.passRate ?? 0, telemetry.setup?.passRate ?? 1);

  let handlerHits = 0;
  let actionHits = 0;
  const declaredPrefixes = region.handlerPrefixes || [];
  const declaredActions = region.actionTypes || [];
  const exercisedSet = new Set();

  for (const mode of ['flow', 'setup']) {
    const t = telemetry[mode];
    if (!t) continue;
    for (const prefix of declaredPrefixes) {
      let prefixHits = 0;
      for (const [key, count] of Object.entries(t.handlerPrefixHits || {})) {
        if (key === prefix || key.startsWith(prefix + '_') || prefix.startsWith(key + '_')) prefixHits += count;
      }
      if (prefixHits > 0) exercisedSet.add(prefix);
      handlerHits += prefixHits;
    }
    for (const at of declaredActions) actionHits += (t.actionTypeHits || {})[at] || 0;
  }

  const totalHits = handlerHits + actionHits;
  if (totalHits === 0) return 'none';

  const prefixRatio = declaredPrefixes.length > 0 ? exercisedSet.size / declaredPrefixes.length : 1;

  // Strong: high pass rate, significant hits, and good prefix coverage
  if (passRate >= 1.0 && totalHits >= 500 && (prefixRatio >= 0.5 || declaredPrefixes.length <= 2)) return 'strong';
  // Partial: decent pass rate and meaningful hits
  if (passRate >= 0.95 && totalHits >= 50) return 'partial';
  return 'weak';
}

function coverageLabel(v) {
  return { strong: 'Well covered', partial: 'Partial', weak: 'Weak', none: 'Not covered' }[v] || 'Not covered';
}

function liveLabel(s) {
  return { untested: 'Untested', partial: 'Partial', verified: 'Verified', broken: 'Broken', stale: 'Stale' }[s] || 'Untested';
}

async function loadJSON(url) {
  try { const r = await fetch(url); return r.ok ? r.json() : null; } catch { return null; }
}

function computeRegionHits(region, telemetry) {
  if (!telemetry) return 0;
  let hits = 0;
  for (const mode of ['flow', 'setup']) {
    const t = telemetry[mode];
    if (!t) continue;
    for (const prefix of (region.handlerPrefixes || [])) {
      for (const [key, count] of Object.entries(t.handlerPrefixHits || {})) {
        if (key === prefix || key.startsWith(prefix + '_') || prefix.startsWith(key + '_')) hits += count;
      }
    }
    for (const ps of (region.pendingStates || [])) hits += (t.pendingStateHits || {})[ps] || 0;
    for (const at of (region.actionTypes || [])) hits += (t.actionTypeHits || {})[at] || 0;
  }
  return hits;
}

function getRegionIncidents(regionId) {
  return (INCIDENTS?.incidents || []).filter(i => i.region === regionId);
}

function getRecentIncidents(maxAge = 7) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - maxAge);
  return (INCIDENTS?.incidents || [])
    .filter(i => new Date(i.timestamp) >= cutoff)
    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}

// ── Modal ──

function openModal(regionId) {
  const region = LEDGER.regions[regionId];
  if (!region) return;
  document.getElementById('modal-region-id').value = regionId;
  document.getElementById('modal-title').textContent = `${region.name}`;
  document.getElementById('modal-note').value = '';
  document.getElementById('modal-gameid').value = '';
  document.getElementById('modal-phase').value = '';
  document.getElementById('modal-action').value = '';
  document.getElementById('modal-undo').checked = false;
  document.getElementById('modal-refresh').checked = false;

  // Set current live status
  document.querySelectorAll('#status-options .status-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.val === (region.liveStatus || 'untested'));
  });
  document.querySelectorAll('#severity-options .status-opt').forEach(el => el.classList.remove('selected'));

  // Show siblings
  const siblings = (region.siblings || []).map(s => {
    const sib = LEDGER.regions[s];
    return sib ? `<a onclick="closeModal();setTimeout(()=>openModal('${s}'),100)">${sib.name}</a>` : s;
  });
  const sibHtml = siblings.length > 0
    ? `<strong>Related areas to also check:</strong> ${siblings.join(', ')}`
    : '';
  document.getElementById('modal-siblings').innerHTML = sibHtml;

  document.getElementById('incident-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('incident-modal').classList.remove('active');
}

document.querySelectorAll('.status-options').forEach(group => {

}

async function saveStatusOnly() {
  const regionId = document.getElementById('modal-region-id').value;
  const newStatus = getSelectedVal('status-options') || 'untested';
  const lastCheck = new Date().toISOString().slice(0, 10);

  if (LEDGER.regions[regionId]) {
    LEDGER.regions[regionId].liveStatus = newStatus;
    LEDGER.regions[regionId].lastLiveCheck = lastCheck;
  }

  // Try backend first
  const result = await apiPost('/api/coverage/status', { regionId, status: newStatus, lastCheck });

  syncToLocalStorage();
  markDirty();
  closeModal();
  render(LEDGER, TELEMETRY);
  renderHandoff();
  showSaveToast(result ? 'Saved to backend' : 'Saved locally only', !!result);

async function saveIncident() {
  const regionId = document.getElementById('modal-region-id').value;
  const severity = getSelectedVal('severity-options');
  const note = document.getElementById('modal-note').value.trim();
  const newStatus = getSelectedVal('status-options') || 'untested';

  if (!note) { alert('Please add a short note'); return; }
  if (!severity) { alert('Please select severity'); return; }

  const lastCheck = new Date().toISOString().slice(0, 10);
  const incident = {
    id: Date.now().toString(36),
    timestamp: new Date().toISOString(),
    region: regionId,
    regionId: regionId,
    regionName: LEDGER.regions[regionId]?.name || regionId,
    severity,
    note,
    gameId: document.getElementById('modal-gameid').value.trim() || null,
    phase: document.getElementById('modal-phase').value.trim() || null,
    lastAction: document.getElementById('modal-action').value.trim() || null,
    undoFixedIt: document.getElementById('modal-undo').checked,
    refreshFixedIt: document.getElementById('modal-refresh').checked,
    liveStatus: newStatus,
    lastCheck,
    siblings: LEDGER.regions[regionId]?.siblings || [],
  };

  // Try backend first
  const result = await apiPost('/api/coverage/incident', incident);

  if (!INCIDENTS) INCIDENTS = { meta: {}, incidents: [] };
  INCIDENTS.incidents.push(incident);

  if (LEDGER.regions[regionId]) {
    LEDGER.regions[regionId].liveStatus = newStatus;
    LEDGER.regions[regionId].lastLiveCheck = lastCheck;
  }

  syncToLocalStorage();
  markDirty();
  closeModal();
  render(LEDGER, TELEMETRY);
  renderHandoff();
  showSaveToast(result ? 'Incident saved to backend' : 'Incident saved locally only', !!result);
}

// ── Dirty tracking ──

let lastExportedAt = null;
let unsavedChanges = false;

function markDirty() {
  unsavedChanges = true;
  updateFileStatus();
}

function updateFileStatus() {
  const el = document.getElementById('file-status');
  if (!el) return;
  if (unsavedChanges) {
    const count = (INCIDENTS?.incidents || []).length;
    el.innerHTML = `<span class="unsaved">${count} incident${count !== 1 ? 's' : ''} — unsaved changes</span>`;
  } else if (lastExportedAt) {
    el.innerHTML = `<span class="saved">Last saved: ${lastExportedAt}</span>`;
  } else {
    const count = (INCIDENTS?.incidents || []).length;
    el.innerHTML = count > 0 ? `${count} incident${count !== 1 ? 's' : ''} loaded from file` : 'No incidents';
  }
}

// ── File I/O ──

function buildIncidentsJSON() {
  return JSON.stringify({
    meta: {
      description: "Live Discord incident log. Each entry records something that went wrong or felt flaky during a real Discord game. Used to drive class-level investigation, not just point fixes.",
      severities: ["blocker", "major", "minor"],
      liveStatuses: ["untested", "partial", "verified", "broken", "stale"],
      lastExported: new Date().toISOString()
    },
    liveStatuses: Object.fromEntries(
      Object.entries(LEDGER?.regions || {})
        .filter(([, r]) => r.liveStatus && r.liveStatus !== 'untested')
        .map(([id, r]) => [id, { liveStatus: r.liveStatus, lastLiveCheck: r.lastLiveCheck, name: r.name }])
    ),
    incidents: (INCIDENTS?.incidents || []).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
  }, null, 2);
}

function downloadJSON(content, filename) {
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportIncidents() {
  const json = buildIncidentsJSON();
  downloadJSON(json, 'coverage-incidents.json');
  unsavedChanges = false;
  lastExportedAt = new Date().toLocaleTimeString();
  updateFileStatus();
}

function exportFullState() {
  const full = {
    exportedAt: new Date().toISOString(),
    incidents: JSON.parse(buildIncidentsJSON()),
    liveStatuses: Object.fromEntries(
      Object.entries(LEDGER?.regions || {}).map(([id, r]) => [id, { liveStatus: r.liveStatus || 'untested', lastLiveCheck: r.lastLiveCheck }])
    )
  };
  downloadJSON(JSON.stringify(full, null, 2), `coverage-full-export-${new Date().toISOString().slice(0,10)}.json`);
  unsavedChanges = false;
  lastExportedAt = new Date().toLocaleTimeString();
  updateFileStatus();
}

function importIncidents(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      // Support both formats: direct incidents file or full export
      const incidents = data.incidents?.incidents || data.incidents || [];
      const liveStatuses = data.incidents?.liveStatuses || data.liveStatuses || {};

      if (!Array.isArray(incidents)) {
        alert('Invalid file: no incidents array found');
        return;
      }

      // Merge incidents (deduplicate by id)
      if (!INCIDENTS) INCIDENTS = { meta: {}, incidents: [] };
      const existingIds = new Set(INCIDENTS.incidents.map(i => i.id));
      let added = 0;
      for (const inc of incidents) {
        if (inc.id && !existingIds.has(inc.id)) {
          INCIDENTS.incidents.push(inc);
          existingIds.add(inc.id);
          added++;
        }
      }

      // Merge live statuses
      let statusUpdated = 0;
      for (const [id, status] of Object.entries(liveStatuses)) {
        if (LEDGER?.regions[id] && status.liveStatus) {
          LEDGER.regions[id].liveStatus = status.liveStatus;
          LEDGER.regions[id].lastLiveCheck = status.lastLiveCheck || LEDGER.regions[id].lastLiveCheck;
          statusUpdated++;
        }
      }

      // Sync to localStorage
      syncToLocalStorage();
      render(LEDGER, TELEMETRY);
      renderHandoff();
      updateFileStatus();

      alert(`Imported: ${added} new incidents, ${statusUpdated} status updates.\n${incidents.length - added} duplicates skipped.`);
    } catch (err) {
      alert('Failed to parse JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = ''; // Reset so same file can be re-imported
}

function resetFromFile() {
  if (!confirm('Reset all incidents and live statuses to the original file data?\nThis will discard any unsaved changes.')) return;
  localStorage.removeItem('coverage-incidents');
  localStorage.removeItem('coverage-ledger-live');
  location.reload();
}

function syncToLocalStorage() {
  localStorage.setItem('coverage-incidents', JSON.stringify((INCIDENTS?.incidents || [])));
  localStorage.setItem('coverage-ledger-live', JSON.stringify(
    Object.fromEntries(Object.entries(LEDGER.regions).map(([id, r]) => [id, { liveStatus: r.liveStatus, lastLiveCheck: r.lastLiveCheck }]))
  ));
}

// ── Claude Handoff ──

function buildHandoffText() {
  const incidents = (INCIDENTS?.incidents || []).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  const regions = LEDGER?.regions || {};

  // Broken/stale regions
  const brokenRegions = Object.entries(regions).filter(([, r]) => r.liveStatus === 'broken');
  const staleRegions = Object.entries(regions).filter(([, r]) => r.liveStatus === 'stale');

  // Recent incidents (last 14 days)
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 14);
  const recent = incidents.filter(i => new Date(i.timestamp) >= cutoff);

  // Blockers first
  const blockers = recent.filter(i => i.severity === 'blocker');
  const majors = recent.filter(i => i.severity === 'major');

  let text = `COVERAGE INCIDENT REPORT (${new Date().toISOString().slice(0,10)})\n`;
  text += `Total incidents: ${incidents.length} | Recent (14d): ${recent.length} | Blockers: ${blockers.length} | Majors: ${majors.length}\n`;
  text += `Broken regions: ${brokenRegions.length} | Stale regions: ${staleRegions.length}\n`;

  if (brokenRegions.length > 0) {
    text += `\nBROKEN REGIONS:\n`;
    for (const [id, r] of brokenRegions) {
      const sibs = (r.siblings || []).map(s => regions[s]?.name).filter(Boolean);
      text += `  - ${r.name} (${id})${sibs.length ? ' | siblings: ' + sibs.join(', ') : ''}\n`;
    }
  }

  if (blockers.length > 0) {
    text += `\nBLOCKER INCIDENTS:\n`;
    for (const inc of blockers) {
      const sibs = (inc.siblings || []).map(s => regions[s]?.name).filter(Boolean);
      text += `  [${inc.timestamp.slice(0,10)}] ${inc.regionName}: ${inc.note}`;
      if (inc.gameId) text += ` (game: ${inc.gameId})`;
      if (inc.phase) text += ` (phase: ${inc.phase})`;
      if (inc.lastAction) text += ` (action: ${inc.lastAction})`;
      if (inc.undoFixedIt) text += ` [undo-fixed]`;
      if (inc.refreshFixedIt) text += ` [refresh-fixed]`;
      text += `\n`;
      if (sibs.length) text += `    Also check: ${sibs.join(', ')}\n`;
    }
  }

  if (majors.length > 0) {
    text += `\nMAJOR INCIDENTS:\n`;
    for (const inc of majors) {
      const sibs = (inc.siblings || []).map(s => regions[s]?.name).filter(Boolean);
      text += `  [${inc.timestamp.slice(0,10)}] ${inc.regionName}: ${inc.note}`;
      if (inc.gameId) text += ` (game: ${inc.gameId})`;
      if (inc.phase) text += ` (phase: ${inc.phase})`;
      if (inc.lastAction) text += ` (action: ${inc.lastAction})`;
      if (inc.undoFixedIt) text += ` [undo-fixed]`;
      if (inc.refreshFixedIt) text += ` [refresh-fixed]`;
      text += `\n`;
      if (sibs.length) text += `    Also check: ${sibs.join(', ')}\n`;
    }
  }

  const minors = recent.filter(i => i.severity === 'minor');
  if (minors.length > 0) {
    text += `\nMINOR INCIDENTS (${minors.length}):\n`;
    for (const inc of minors) {
      text += `  [${inc.timestamp.slice(0,10)}] ${inc.regionName}: ${inc.note}`;
      if (inc.phase) text += ` (phase: ${inc.phase})`;
      text += `\n`;
    }
  }

  if (staleRegions.length > 0) {
    text += `\nSTALE REGIONS (code changed since last check):\n`;
    for (const [id, r] of staleRegions) {
      text += `  - ${r.name}\n`;
    }
  }

  if (incidents.length === 0 && brokenRegions.length === 0) {
    text += `\nNo incidents or broken regions recorded.`;
  }

  text += `\nCanonical file: tests/headless/coverage-incidents.json`;
  return text;
}

function renderHandoff() {
  const box = document.getElementById('handoff-box');
  if (box) box.textContent = buildHandoffText();
}

function copyHandoff() {
  const text = buildHandoffText();
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('copy-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

function loadLocalState() {
  // Merge saved live statuses
  try {
    const saved = JSON.parse(localStorage.getItem('coverage-ledger-live') || '{}');
    for (const [id, data] of Object.entries(saved)) {
      if (LEDGER.regions[id]) {
        LEDGER.regions[id].liveStatus = data.liveStatus || LEDGER.regions[id].liveStatus;
        LEDGER.regions[id].lastLiveCheck = data.lastLiveCheck || LEDGER.regions[id].lastLiveCheck;
      }
    }
  } catch {}

  // Merge saved incidents
  try {
    const savedInc = JSON.parse(localStorage.getItem('coverage-incidents') || '[]');
    if (savedInc.length > 0) {
      if (!INCIDENTS) INCIDENTS = { meta: {}, incidents: [] };
      // Deduplicate by id
      const existingIds = new Set(INCIDENTS.incidents.map(i => i.id));
      for (const inc of savedInc) {
        if (!existingIds.has(inc.id)) INCIDENTS.incidents.push(inc);
      }
    }
  } catch {}
}

function render(ledger, telemetry) {
  const regions = ledger?.regions || {};
  const regionList = Object.entries(regions);

  const regionHits = {};
  const effectiveVerif = {};
  for (const [id, region] of regionList) {
    regionHits[id] = computeRegionHits(region, telemetry);
    const autoLevel = computeAutoVerification(region, telemetry);
    const manualLevel = region.verification || 'none';
    effectiveVerif[id] = maxVerif(autoLevel, manualLevel);
  }

  // Summary — uses effective (auto-promoted) verification
  const vCounts = { strong: 0, partial: 0, weak: 0, none: 0 };
  for (const [id] of regionList) vCounts[effectiveVerif[id]] = (vCounts[effectiveVerif[id]] || 0) + 1;
  const totalHits = Object.values(regionHits).reduce((a, b) => a + b, 0);
  const exploredCount = Object.values(regionHits).filter(h => h > 0).length;
  const totalIncidents = (INCIDENTS?.incidents || []).length;
  const brokenCount = regionList.filter(([, r]) => r.liveStatus === 'broken').length;

  document.getElementById('summary').innerHTML = `
    <div class="summary-item cov-strong">${vCounts.strong} Well Covered</div>
    <div class="summary-item cov-partial">${vCounts.partial} Partial</div>
    <div class="summary-item cov-weak">${vCounts.weak} Weak</div>
    <div class="summary-item cov-none">${vCounts.none} Not Covered</div>
    <div class="summary-item meta">${exploredCount}/${regionList.length} explored</div>
    ${totalIncidents > 0 ? `<div class="summary-item incident">${totalIncidents} incidents${brokenCount > 0 ? ` (${brokenCount} broken)` : ''}</div>` : ''}
  `;

  // Telemetry (hidden from main view, available in legend)

  // Region cards
  const regionsEl = document.getElementById('regions');
  regionsEl.innerHTML = '';
  for (const cat of CATEGORIES) {
    const catRegions = regionList.filter(([, r]) => r.category === cat.id);
    if (!catRegions.length) continue;

    const section = document.createElement('div');
    section.className = 'category';
    section.innerHTML = `<div class="category-header">${cat.label}</div>`;
    const grid = document.createElement('div');
    grid.className = 'region-grid';

    for (const [id, region] of catRegions) {
      const hits = regionHits[id];
      const freq = frequencyLabel(hits);
      const verif = effectiveVerif[id];
      const live = region.liveStatus || 'untested';
      const incidents = getRegionIncidents(id);

      const card = document.createElement('div');
      card.className = `card cov-${verif}`;
      card.style.cursor = 'pointer';
      card.onclick = () => openModal(id);
      card.innerHTML = `
        <div class="card-name">${region.name}${incidents.length > 0 ? `<span class="incident-count">${incidents.length}</span>` : ''}</div>
        <div style="display:flex;flex-direction:column;gap:3px;margin-top:4px;font-size:12px">
          <div style="display:flex;align-items:center;gap:6px"><span style="color:#e6edf3">Coverage:</span><span class="cov-pill cov-${verif}">${coverageLabel(verif)}</span></div>
          <div style="display:flex;align-items:center;gap:6px"><span style="color:#e6edf3">Frequency:</span><span style="color:${freq.color};font-size:12px;font-weight:bold">${freq.label}</span></div>
          <div style="display:flex;align-items:center;gap:6px"><span style="color:#e6edf3">Discord:</span><span class="live-pill ${live}" style="cursor:default">${liveLabel(live)}</span></div>
        </div>
      `;
      grid.appendChild(card);
    }

    section.appendChild(grid);
    regionsEl.appendChild(section);
  }

  // Recent Incidents
  const recent = getRecentIncidents(30);
  const incEl = document.getElementById('recent-incidents');
  if (recent.length > 0) {
    incEl.style.display = 'block';
    let html = '<h2>Recent Incidents</h2>';
    for (const inc of recent.slice(0, 20)) {
      const date = inc.timestamp.slice(0, 10);
      const time = inc.timestamp.slice(11, 16);
      const region = regions[inc.region];
      const sibNames = (inc.siblings || []).map(s => regions[s]?.name).filter(Boolean);
      html += `<div class="incident-entry">
        <span style="color:#b0b8c1">${date} ${time}</span>
        <span class="sev-badge ${inc.severity}">${inc.severity}</span>
        <strong style="margin:0 6px">${inc.regionName}</strong>
        ${inc.note}
        ${inc.gameId ? `<span style="color:#b0b8c1;margin-left:6px">game:${inc.gameId}</span>` : ''}
        ${inc.lastAction ? `<span style="color:#b0b8c1;margin-left:4px">action:${inc.lastAction}</span>` : ''}
        ${inc.undoFixedIt ? '<span style="color:#58a6ff;margin-left:4px;font-size:10px">undo-fixed</span>' : ''}
        ${inc.refreshFixedIt ? '<span style="color:#58a6ff;margin-left:4px;font-size:10px">refresh-fixed</span>' : ''}
        ${sibNames.length > 0 ? `<div style="font-size:9px;color:#b0b8c1;margin-top:2px">Also check: ${sibNames.join(', ')}</div>` : ''}
      </div>`;
    }
    incEl.innerHTML = html;
  } else {
    incEl.style.display = 'none';
  }

  // Needs More Testing: Frequently reached (uses effective verification)
  const hotList = regionList
    .filter(([id, r]) => (effectiveVerif[id] === 'none' || effectiveVerif[id] === 'weak') && regionHits[id] >= 50)
    .sort((a, b) => regionHits[b[0]] - regionHits[a[0]]);

  const hotEl = document.getElementById('needs-hot');
  if (hotList.length > 0) {
    hotEl.style.display = 'block';
    let html = '<h2 style="color:#ff6b35">Needs More Testing: Frequently Reached</h2>';
    html += '<div class="section-desc">High sim traffic, weak/no coverage.</div>';
    for (let i = 0; i < hotList.length; i++) {
      const [id, r] = hotList[i];
      const ev = effectiveVerif[id];
      html += `<div class="needs-item">
        <span class="needs-rank" style="color:#ff6b35">#${i+1}</span>
        <span class="needs-name">${r.name}</span>
        <span class="needs-hits">${regionHits[id].toLocaleString()} hits</span>
        <span class="cov-pill cov-${ev}" style="font-size:9px">${coverageLabel(ev)}</span>
        <span class="live-pill ${r.liveStatus||'untested'}" style="font-size:9px;cursor:default">${liveLabel(r.liveStatus)}</span>
      </div>`;
    }
    hotEl.innerHTML = html;
  } else {
    hotEl.style.display = 'none';
  }

  // Needs More Testing: Rarely reached (uses effective verification)
  const darkList = regionList
    .filter(([id, r]) => (effectiveVerif[id] === 'none' || effectiveVerif[id] === 'weak') && regionHits[id] < 50)
    .sort((a, b) => {
      if (effectiveVerif[a[0]] !== effectiveVerif[b[0]]) return effectiveVerif[a[0]] === 'none' ? -1 : 1;
      return a[1].name.localeCompare(b[1].name);
    });

  const darkEl = document.getElementById('needs-dark');
  if (darkList.length > 0) {
    darkEl.style.display = 'block';
    let html = '<h2 style="color:#8b949e">Needs More Testing: Rarely Reached</h2>';
    html += '<div class="section-desc">Low/no sim traffic, weak/no coverage.</div>';
    for (const [id, r] of darkList) {
      const ev = effectiveVerif[id];
      html += `<div class="needs-item">
        <span class="needs-rank" style="color:#8b949e">--</span>
        <span class="needs-name" style="color:${ev === 'none' ? '#8b949e' : '#c9d1d9'}">${r.name}</span>
        <span class="needs-hits" style="color:#8b949e">${regionHits[id]} hits</span>
        <span class="cov-pill cov-${ev}" style="font-size:9px">${coverageLabel(ev)}</span>
      </div>`;
    }
    darkEl.innerHTML = html;
  } else {
    darkEl.style.display = 'none';
  }

  // History
  const history = ledger?.history || [];
  const historyEl = document.getElementById('history');
  if (history.length > 0) {
    historyEl.style.display = 'block';
    let html = '<h2>Coverage History</h2>';
    for (const h of history) {
      html += `<div class="history-item">
        <span class="date">${h.date}</span> &mdash;
        <span class="change"><strong>${regions[h.region]?.name || h.region}</strong>: ${h.from || 'new'} &rarr; ${h.to}</span>
        &mdash; <span style="color:#b0b8c1">${h.reason}</span>
      </div>`;
    }
    historyEl.innerHTML = html;
  }
}

// Close modal on overlay click
document.getElementById('incident-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

(async () => {
  // Check backend — DB is the source of truth (synced from ledger on every deploy)
  await checkBackend();
  updateBackendIndicator();

  let ledger = null;
  const telemetry = await loadJSON('./coverage-telemetry.json');

  if (backendAvailable) {
    const dbData = await apiGet('/api/coverage/regions');
    if (dbData?.regions) {
      ledger = { regions: dbData.regions };
    }
  }

  // Fall back to JSON file if backend unavailable
  if (!ledger) {
    ledger = await loadJSON('./coverage-ledger.json');
  }

  if (!ledger) {
    document.getElementById('regions').innerHTML = '<div class="no-data">Could not load coverage data. Start the bot (DB mode) or serve this directory with: npx http-server tests/headless -p 8080</div>';
    return;
  }

  LEDGER = ledger;
  TELEMETRY = telemetry;
  INCIDENTS = await loadJSON('./coverage-incidents.json');
  loadLocalState();

  // Load incidents from DB if available
  if (backendAvailable) {
    const dbIncidents = await apiGet('/api/coverage/incidents?limit=200');
    if (dbIncidents && dbIncidents.length > 0) {
      if (!INCIDENTS) INCIDENTS = { meta: {}, incidents: [] };
      const existingIds = new Set(INCIDENTS.incidents.map(i => i.id));
      for (const inc of dbIncidents) {
        const key = `db-${inc.id}`;
        if (!existingIds.has(key)) {
          INCIDENTS.incidents.push({
            id: key,
            timestamp: inc.createdAt,
            region: inc.regionId,
            regionName: inc.regionName,
            severity: inc.severity,
            note: inc.note,
            gameId: inc.gameId,
            phase: inc.phase,
            lastAction: inc.lastAction,
            undoFixedIt: inc.undoFixed,
            refreshFixedIt: inc.refreshFixed,
            siblings: inc.siblings || [],
          });
          existingIds.add(key);
        }
      }
    }
  }

  renderLegend();
  render(LEDGER, TELEMETRY);
  renderHandoff();
  updateFileStatus();
})();
</script>
</body>
</html>
