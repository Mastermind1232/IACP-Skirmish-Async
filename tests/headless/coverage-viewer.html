<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coverage Map</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #c9d1d9; font-family: 'Consolas', 'Monaco', monospace; padding: 20px; }
h1 { font-size: 20px; margin-bottom: 4px; }
.subtitle { color: #8b949e; font-size: 12px; margin-bottom: 16px; }

/* Legend */
.legend { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 12px; line-height: 1.6; }
.legend-title { font-weight: bold; color: #c9d1d9; margin-bottom: 6px; font-size: 13px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.legend-swatch { width: 32px; height: 16px; border-radius: 4px; flex-shrink: 0; }
.legend-bar-demo { height: 6px; border-radius: 3px; flex-shrink: 0; }
.legend-label { color: #8b949e; }
.legend-divider { border-top: 1px solid #21262d; margin: 8px 0; }

/* Summary bar */
.summary { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.summary-item { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; }
.summary-item.cov-strong { background: #152c15; border: 1px solid #27ae60; color: #27ae60; }
.summary-item.cov-partial { background: #2c2515; border: 1px solid #d4a017; color: #d4a017; }
.summary-item.cov-weak { background: #2c1515; border: 1px solid #c0392b; color: #c0392b; }
.summary-item.cov-none { background: #1a1a2e; border: 1px solid #555; color: #888; }
.summary-item.meta { background: #161b22; border: 1px solid #30363d; color: #8b949e; }

/* Telemetry info */
.telemetry-info { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 14px; margin-bottom: 20px; font-size: 11px; color: #8b949e; }
.telemetry-info strong { color: #c9d1d9; }

/* Category sections */
.category { margin-bottom: 24px; }
.category-header { font-size: 14px; text-transform: uppercase; color: #8b949e; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }

/* Region grid */
.region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

/* Region cards — background = coverage */
.card { border-radius: 8px; padding: 10px 12px; position: relative; transition: transform 0.1s; cursor: default; border: 1px solid transparent; }
.card:hover { transform: translateY(-2px); }
.card.cov-strong { background: #132e13; border-color: #27ae60; }
.card.cov-partial { background: #2a2210; border-color: #d4a017; }
.card.cov-weak { background: #2a1414; border-color: #c0392b; }
.card.cov-none { background: #161620; border-color: #333; }

.card-name { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
.card.cov-none .card-name { color: #666; }

/* Status line: Coverage + Exploration on one row */
.card-status { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 11px; }
.cov-label { font-weight: bold; padding: 2px 6px; border-radius: 3px; font-size: 10px; text-transform: uppercase; }
.cov-label.cov-strong { background: #27ae60; color: #000; }
.cov-label.cov-partial { background: #d4a017; color: #000; }
.cov-label.cov-weak { background: #c0392b; color: #fff; }
.cov-label.cov-none { background: #333; color: #888; }
.expl-label { color: #8b949e; }

/* Exploration meter (compact bar + label) */
.expl-meter { display: flex; align-items: center; gap: 5px; flex: 1; }
.expl-bar-bg { height: 6px; width: 60px; background: #21262d; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.expl-bar { height: 100%; border-radius: 3px; }
.expl-bar.freq { background: #ff6b35; }
.expl-bar.common { background: #e2b93d; }
.expl-bar.rare { background: #3d8bfd; }
.expl-bar.never { background: transparent; }
.expl-text { font-size: 10px; color: #8b949e; white-space: nowrap; }

/* Needs-testing badge */
.needs-testing { position: absolute; top: 6px; right: 8px; font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
.needs-testing.hot { background: #ff6b35; color: #000; }
.needs-testing.dark { background: #444; color: #ccc; }

/* Evidence badges */
.evidence-row { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 3px; }
.evidence-badge { font-size: 9px; padding: 1px 5px; border-radius: 2px; }
.evidence-badge.setup-harness { background: #1a3a1a; color: #3fb950; }
.evidence-badge.flow-harness { background: #1a2a3a; color: #58a6ff; }
.evidence-badge.sim-farm { background: #2a1a3a; color: #bc8cff; }
.evidence-badge.ds-invariants { background: #3a2a1a; color: #d29922; }
.evidence-badge.gs-invariants { background: #3a1a2a; color: #f778ba; }
.evidence-badge.production-fix { background: #152c15; color: #27ae60; }
.evidence-badge.live-incident { background: #2c1515; color: #f85149; }
.evidence-badge.mutation-tested { background: #1a3a3a; color: #56d4dd; }
.evidence-badge.synthetic-only { background: #1a1a2e; color: #666; }

/* Card details (hover-expand) */
.card-notes { font-size: 10px; color: #6e7681; margin-top: 4px; max-height: 0; overflow: hidden; transition: max-height 0.2s; }
.card:hover .card-notes { max-height: 120px; }

/* Needs More Testing section */
.needs-section { margin-top: 24px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
.needs-section h2 { font-size: 14px; margin-bottom: 4px; }
.needs-section .section-desc { font-size: 11px; color: #8b949e; margin-bottom: 10px; }
.needs-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid #21262d; font-size: 12px; }
.needs-item:last-child { border-bottom: none; }
.needs-rank { font-weight: bold; min-width: 20px; }
.needs-name { flex: 1; }
.needs-hits { color: #d4a017; font-size: 11px; }
.needs-why { color: #8b949e; font-size: 10px; }

/* History section */
.history-section { margin-top: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
.history-section h2 { font-size: 14px; color: #27ae60; margin-bottom: 10px; }
.history-item { font-size: 11px; padding: 4px 0; border-bottom: 1px solid #21262d; color: #8b949e; }
.history-item:last-child { border-bottom: none; }
.history-item .date { color: #6e7681; }
.history-item .change { color: #c9d1d9; }

/* No data */
.no-data { color: #6e7681; font-style: italic; padding: 20px; text-align: center; }
</style>
</head>
<body>

<h1>Coverage Map</h1>
<div class="subtitle">How well is each part of the game tested? How often do sims reach it?</div>

<div id="legend" class="legend"></div>
<div id="summary" class="summary"></div>
<div id="telemetry-info" class="telemetry-info"></div>
<div id="regions"></div>
<div id="needs-hot" class="needs-section" style="display:none"></div>
<div id="needs-dark" class="needs-section" style="display:none"></div>
<div id="history" class="history-section" style="display:none"></div>

<script>
const CATEGORIES = [
  { id: 'setup', label: 'Setup & Deployment' },
  { id: 'activation', label: 'Activation & Actions' },
  { id: 'combat', label: 'Combat' },
  { id: 'effects', label: 'Effects & Conditions' },
  { id: 'round', label: 'Round Management' },
  { id: 'game', label: 'Game Lifecycle' },
  { id: 'discord', label: 'Discord / Surface' },
];

// Exploration thresholds
function classifyExploration(hits) {
  if (hits >= 500) return { label: 'Frequent', cls: 'freq', pct: 100 };
  if (hits >= 50)  return { label: 'Common', cls: 'common', pct: 70 };
  if (hits >= 1)   return { label: 'Rare', cls: 'rare', pct: 30 };
  return { label: 'Never', cls: 'never', pct: 0 };
}

// Plain-English coverage labels
function coverageLabel(v) {
  switch (v) {
    case 'strong': return 'Well covered';
    case 'partial': return 'Partially covered';
    case 'weak': return 'Weakly covered';
    default: return 'Not covered';
  }
}

async function loadJSON(url) {
  try { const r = await fetch(url); return r.ok ? r.json() : null; }
  catch { return null; }
}

function computeRegionHits(region, telemetry) {
  if (!telemetry) return 0;
  let hits = 0;
  for (const mode of ['flow', 'setup']) {
    const t = telemetry[mode];
    if (!t) continue;
    for (const prefix of (region.handlerPrefixes || [])) {
      for (const [key, count] of Object.entries(t.handlerPrefixHits || {})) {
        if (key === prefix || key.startsWith(prefix + '_') || prefix.startsWith(key + '_')) hits += count;
      }
    }
    for (const ps of (region.pendingStates || [])) hits += (t.pendingStateHits || {})[ps] || 0;
    for (const at of (region.actionTypes || [])) hits += (t.actionTypeHits || {})[at] || 0;
  }
  return hits;
}

function renderLegend() {
  document.getElementById('legend').innerHTML = `
    <div class="legend-title">How to read this map</div>
    <div style="display:flex;gap:40px;flex-wrap:wrap">
      <div>
        <div style="color:#8b949e;font-weight:bold;margin-bottom:4px">Card background = Coverage (how well tested)</div>
        <div class="legend-row"><div class="legend-swatch" style="background:#132e13;border:1px solid #27ae60"></div><span class="legend-label">Well covered</span></div>
        <div class="legend-row"><div class="legend-swatch" style="background:#2a2210;border:1px solid #d4a017"></div><span class="legend-label">Partially covered</span></div>
        <div class="legend-row"><div class="legend-swatch" style="background:#2a1414;border:1px solid #c0392b"></div><span class="legend-label">Weakly covered</span></div>
        <div class="legend-row"><div class="legend-swatch" style="background:#161620;border:1px solid #333"></div><span class="legend-label">Not covered</span></div>
      </div>
      <div>
        <div style="color:#8b949e;font-weight:bold;margin-bottom:4px">Exploration meter = How often sims reach this area</div>
        <div class="legend-row"><div class="legend-bar-demo" style="width:60px;background:#ff6b35"></div><span class="legend-label">Frequent (500+ hits)</span></div>
        <div class="legend-row"><div class="legend-bar-demo" style="width:42px;background:#e2b93d"></div><span class="legend-label">Common (50-499)</span></div>
        <div class="legend-row"><div class="legend-bar-demo" style="width:18px;background:#3d8bfd"></div><span class="legend-label">Rare (1-49)</span></div>
        <div class="legend-row"><div class="legend-bar-demo" style="width:60px;background:#21262d"></div><span class="legend-label">Never (0 hits)</span></div>
      </div>
    </div>
  `;
}

function render(ledger, telemetry) {
  const regions = ledger?.regions || {};
  const regionList = Object.entries(regions);

  const regionHits = {};
  let maxHits = 1;
  for (const [id, region] of regionList) {
    const hits = computeRegionHits(region, telemetry);
    regionHits[id] = hits;
    if (hits > maxHits) maxHits = hits;
  }

  // Summary
  const vCounts = { strong: 0, partial: 0, weak: 0, none: 0 };
  for (const [, r] of regionList) vCounts[r.verification] = (vCounts[r.verification] || 0) + 1;
  const totalHits = Object.values(regionHits).reduce((a, b) => a + b, 0);
  const exploredCount = Object.values(regionHits).filter(h => h > 0).length;

  document.getElementById('summary').innerHTML = `
    <div class="summary-item cov-strong">${vCounts.strong} Well Covered</div>
    <div class="summary-item cov-partial">${vCounts.partial} Partial</div>
    <div class="summary-item cov-weak">${vCounts.weak} Weak</div>
    <div class="summary-item cov-none">${vCounts.none} Not Covered</div>
    <div class="summary-item meta">${exploredCount}/${regionList.length} explored</div>
    <div class="summary-item meta">${totalHits.toLocaleString()} total sim hits</div>
  `;

  // Telemetry info
  const flowT = telemetry?.flow, setupT = telemetry?.setup;
  let info = '';
  if (flowT) info += `<strong>Flow:</strong> ${flowT.simCount} sims, ${(flowT.passRate*100).toFixed(0)}% pass (${flowT.timestamp?.slice(0,10)||'?'}) &nbsp; `;
  if (setupT) info += `<strong>Setup:</strong> ${setupT.simCount} sims, ${(setupT.passRate*100).toFixed(0)}% pass (${setupT.timestamp?.slice(0,10)||'?'})`;
  if (!info) info = 'No telemetry. Run <code>node tests/headless/sim-farm.js 500</code> to generate.';
  document.getElementById('telemetry-info').innerHTML = info;

  // Region cards
  const regionsEl = document.getElementById('regions');
  regionsEl.innerHTML = '';
  for (const cat of CATEGORIES) {
    const catRegions = regionList.filter(([, r]) => r.category === cat.id);
    if (!catRegions.length) continue;

    const section = document.createElement('div');
    section.className = 'category';
    section.innerHTML = `<div class="category-header">${cat.label}</div>`;
    const grid = document.createElement('div');
    grid.className = 'region-grid';

    for (const [id, region] of catRegions) {
      const hits = regionHits[id];
      const expl = classifyExploration(hits);
      const verif = region.verification || 'none';
      const evidence = region.evidence || [];
      const isWeakOrNone = verif === 'none' || verif === 'weak';
      const needsTesting = isWeakOrNone;
      const isHot = needsTesting && hits >= 50;
      const isDark = needsTesting && hits === 0 && verif === 'none';

      const card = document.createElement('div');
      card.className = `card cov-${verif}`;
      card.innerHTML = `
        <div class="card-name">${region.name}</div>
        ${isHot ? '<span class="needs-testing hot">Frequently reached, weakly tested</span>' : ''}
        ${isDark ? '<span class="needs-testing dark">Not explored yet</span>' : ''}
        <div class="card-status">
          <span class="cov-label cov-${verif}">${coverageLabel(verif)}</span>
          <div class="expl-meter">
            <div class="expl-bar-bg"><div class="expl-bar ${expl.cls}" style="width:${expl.pct}%"></div></div>
            <span class="expl-text">${expl.label}${hits > 0 ? ' (' + hits.toLocaleString() + ')' : ''}</span>
          </div>
        </div>
        ${evidence.length > 0 ? `<div class="evidence-row">${evidence.map(e => `<span class="evidence-badge ${e}">${e}</span>`).join('')}</div>` : ''}
        <div class="card-notes">${region.notes || ''}</div>
      `;
      grid.appendChild(card);
    }

    section.appendChild(grid);
    regionsEl.appendChild(section);
  }

  // Needs More Testing: Frequently reached but weakly tested
  const hotList = regionList
    .filter(([id, r]) => (r.verification === 'none' || r.verification === 'weak') && regionHits[id] >= 50)
    .sort((a, b) => regionHits[b[0]] - regionHits[a[0]]);

  const hotEl = document.getElementById('needs-hot');
  if (hotList.length > 0) {
    hotEl.style.display = 'block';
    let html = '<h2 style="color:#ff6b35">Needs More Testing: Frequently Reached</h2>';
    html += '<div class="section-desc">These areas are hit often by sims but have weak or no real test coverage. Best candidates to deepen next.</div>';
    for (let i = 0; i < hotList.length; i++) {
      const [id, r] = hotList[i];
      html += `<div class="needs-item">
        <span class="needs-rank" style="color:#ff6b35">#${i+1}</span>
        <span class="needs-name">${r.name}</span>
        <span class="needs-hits">${regionHits[id].toLocaleString()} hits</span>
        <span class="cov-label cov-${r.verification}" style="font-size:9px">${coverageLabel(r.verification)}</span>
      </div>`;
    }
    hotEl.innerHTML = html;
  }

  // Needs More Testing: Rarely reached or never explored
  const darkList = regionList
    .filter(([id, r]) => (r.verification === 'none' || r.verification === 'weak') && regionHits[id] < 50)
    .sort((a, b) => {
      if (a[1].verification !== b[1].verification) return a[1].verification === 'none' ? -1 : 1;
      return a[1].name.localeCompare(b[1].name);
    });

  const darkEl = document.getElementById('needs-dark');
  if (darkList.length > 0) {
    darkEl.style.display = 'block';
    let html = '<h2 style="color:#8b949e">Needs More Testing: Rarely Reached</h2>';
    html += '<div class="section-desc">These areas have low or no sim traffic and weak/no coverage. May need targeted tests or new harness support.</div>';
    for (const [id, r] of darkList) {
      html += `<div class="needs-item">
        <span class="needs-rank" style="color:#555">--</span>
        <span class="needs-name" style="color:${r.verification === 'none' ? '#555' : '#999'}">${r.name}</span>
        <span class="needs-hits" style="color:#555">${regionHits[id]} hits</span>
        <span class="cov-label cov-${r.verification}" style="font-size:9px">${coverageLabel(r.verification)}</span>
      </div>`;
    }
    darkEl.innerHTML = html;
  }

  // History
  const history = ledger?.history || [];
  const historyEl = document.getElementById('history');
  if (history.length > 0) {
    historyEl.style.display = 'block';
    let html = '<h2>Coverage History</h2>';
    for (const h of history) {
      html += `<div class="history-item">
        <span class="date">${h.date}</span> &mdash;
        <span class="change"><strong>${regions[h.region]?.name || h.region}</strong>: ${h.from || 'new'} &rarr; ${h.to}</span>
        &mdash; <span style="color:#6e7681">${h.reason}</span>
      </div>`;
    }
    historyEl.innerHTML = html;
  }
}

(async () => {
  const [ledger, telemetry] = await Promise.all([
    loadJSON('./coverage-ledger.json'),
    loadJSON('./coverage-telemetry.json'),
  ]);
  if (!ledger) {
    document.getElementById('regions').innerHTML = '<div class="no-data">Could not load coverage-ledger.json. Serve this directory with: npx http-server tests/headless -p 8080</div>';
    return;
  }
  renderLegend();
  render(ledger, telemetry);
})();
</script>
</body>
</html>
